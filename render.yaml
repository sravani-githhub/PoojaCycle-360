services:
  - type: web
    name: poojacycle360
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m alembic upgrade head && python -m app.seed_demo && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: poojacycle360-db
          property: connectionString
      - key: DEMO_MODE
        value: "true"

databases:
  - name: poojacycle360-db
    databaseName: poojacycle360
    user: poojacycle360
    plan: free
    region: singapore
    postgresMajorVersion: "16"